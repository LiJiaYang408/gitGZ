# 输入/输出 JAR
-injars "E:\LiJiaYang\demo\DataAnalysis\rear-end\target\rear-end-0.0.1-SNAPSHOT.jar"
-outjars "E:\LiJiaYang\demo\DataAnalysis\rear-end\target\rear-end-obfuscated.jar"

# JDK 17 库路径
-libraryjars "C:/Program Files/Java/jdk-17/jmods/java.base.jmod"

# 其他依赖 JAR 文件...

# 保留 Spring 核心类和注解
-keep class org.springframework.boot.** { *; }
-keep class org.springframework.context.** { *; }
-keep @org.springframework.stereotype.* class *
-keep @org.springframework.web.bind.annotation.* class *
-keep @org.springframework.transaction.annotation.Transactional class *
-keep class org.springframework.web.servlet.** { *; }

# 保留 MyBatis 相关
-keep @org.apache.ibatis.annotations.* class *
-keep interface com.example.rearend.mapper.** { *; }

# 保留 Lombok 模型类并忽略警告
-keep class com.example.rearend.model.** { *; }
-dontwarn lombok.**

# 保留 POI 类并忽略警告
-keep class org.apache.poi.** { *; }
-dontwarn org.apache.poi.**

# 保留所有自定义类（根据实际包名调整）
-keep class com.example.rearend.** { *; }

# 混淆规则
-optimizationpasses 5
-dontusemixedcaseclassnames
-dontskipnonpubliclibraryclasses
-verbose
-ignorewarnings